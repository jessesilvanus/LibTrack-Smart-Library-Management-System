services:
  - type: web
    name: libtrack-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ADMIN_EMAIL
        value: jessetemp923@gmail.com
      - key: EMAIL_FROM
        value: "LibTrack Admin <jessetemp923@gmail.com>"
      - key: ADMIN_API_KEY
        value: libtrack-admin-secret-2024
      - key: MONGODB_URI
        sync: false
